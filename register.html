<!DOCTYPE html>

<html lang="en">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        GlowBeauty | Create Account
    </title>


    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <!-- CSS -->

    <link rel="stylesheet" href="css/register.css">


</head>


<body>



    <div class="register-container">



        <!-- Image Side -->


        <div class="register-image">


            <div class="overlay"></div>


            <div class="register-brand">


                <h1>
                    Glow<span>Beauty</span>
                </h1>


                <p>
                    Create your beauty journey with us
                </p>


            </div>


        </div>





        <!-- Register Form -->


        <div class="register-box">


            <h2>
                Create Account
            </h2>


            <p class="subtitle">
                Join GlowBeauty and discover your beauty essentials
            </p>




            <form id="registerForm">



                <!-- Full Name -->

                <div class="input-group">


                    <i class="fa-solid fa-user"></i>


                    <input type="text" id="name" placeholder="Full Name" required>


                </div>





                <!-- Email -->

                <div class="input-group">


                    <i class="fa-solid fa-envelope"></i>


                    <input type="email" id="email" placeholder="Email Address" required>


                </div>





                <!-- Phone -->

                <div class="input-group">


                    <i class="fa-solid fa-phone"></i>


                    <input type="tel" id="phone" placeholder="Phone Number" required>


                </div>





                <!-- Password -->

                <div class="input-group">


                    <i class="fa-solid fa-lock"></i>


                    <input type="password" id="password" placeholder="Password" required>



                    <i class="fa-solid fa-eye show-password"></i>


                </div>






                <!-- Confirm Password -->


                <div class="input-group">


                    <i class="fa-solid fa-lock"></i>


                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>


                </div>





                <div class="terms">


                    <input type="checkbox" required>


                    <span>
                        I agree to GlowBeauty Terms & Conditions
                    </span>


                </div>






                <button type="submit">

                    Create Account

                </button>





                <p class="login-link">


                    Already have an account?


                    <a href="login.html">
                        Login
                    </a>


                </p>




            </form>



        </div>



    </div>






    <script src="js/register.js"></script>


</body>

</html>
